<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/src/assets/Logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grano de Oro</title>


    <!-- Conexión anticipada a Cloudinary (imágenes de productos) -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>

    <!-- Pide los productos a la API desde el HTML, sin esperar a que cargue el JS (api.js lo recoge) -->
    <script>
      (function () {
        var u = '%VITE_API_URL%';
        if (!u || u.indexOf('%') > -1) return;
        window.__precarga = {
          productos: fetch(u + '/productos/buscar')
            .then(function (r) { return r.ok ? r.json() : null })
            .catch(function () { return null }),
        };
      })();
    </script>

    <!-- Carga optimizada y no bloqueante de Google Fonts (Playfair Display y Outfit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700&display=swap">
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
